[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mingyirx"
version = "0.14.0"
description = "Privacy-first longitudinal prescription analytics for senior TCM physician records"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Xinbo Yu"}
]
dependencies = []

[project.scripts]
mingyirx = "mingyirx.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
